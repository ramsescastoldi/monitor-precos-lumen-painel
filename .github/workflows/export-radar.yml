name: Export Radar (postos ANP → KV)

on:
  schedule:
    # seg e qui 09:00 UTC (06:00 BRT) — backup só-ANP; a rodada completa
    # (ANP + Preço da Hora BA) roda DIÁRIA no Mac via launchd
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_PDH: "1"    # Preço da Hora BA roda só no Mac (cota do PRODEB por IP)
      SKIP_BPAM: "1"   # Busca Preço AM idem: varredura longa, roda no Mac
      SKIP_NP: "1"     # Nota Paraná idem: ritmo de 4s estoura o timeout de 15 min
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node export-radar.mjs
