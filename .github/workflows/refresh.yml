name: Refresh painel monitor precos

on:
  schedule:
    # A cada 1 hora
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "ERRO: secret NETLIFY_BUILD_HOOK nao configurado."
            exit 1
          fi
          curl -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Build disparado no Netlify."
