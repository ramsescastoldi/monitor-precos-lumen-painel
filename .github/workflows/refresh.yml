name: Refresh painel monitor precos (Cloudflare)

on:
  schedule:
    # A cada 1 hora
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit to trigger Cloudflare auto-rebuild
        run: |
          git config user.name "Refresh Bot"
          git config user.email "bot@lumenposto.com"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit --allow-empty -m "refresh painel — $NOW"
          git push origin main
          echo "Empty commit pushed — Cloudflare vai rebuildar automaticamente."
