name: Send WhatsApp NOW (one-shot)
on:
  push:
    branches: [whatsapp-notify-now]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send via Evolution API (bot-vendas)
        uses: actions/github-script@v7
        with:
          script: |
            const https = require("https");
            const b64 = "";
            const msg = Buffer.from(b64, "base64").toString("utf8");
            const body = JSON.stringify({ number: "120363423205444034@g.us", text: msg });
            console.log("Message preview:", msg.substring(0, 80));
            console.log("Body size:", body.length, "bytes");
            const result = await new Promise((resolve, reject) => {
              const req = https.request({
                hostname: "evolution.srv1662375.hstgr.cloud",
                path: "/message/sendText/bot-vendas",
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": "a8f3d92e7c4b1a6f5e0d8c2b9a7f4e3d6c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7e",
                  "Content-Length": Buffer.byteLength(body)
                }
              }, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => resolve({ status: res.statusCode, body: data }));
              });
              req.on("error", reject);
              req.write(body);
              req.end();
            });
            console.log("HTTP Status:", result.status);
            console.log("Response:", result.body);
            if (result.status < 200 || result.status >= 300) {
              core.setFailed("Evolution API HTTP " + result.status + ": " + result.body);
            } else {
              console.log("=== Mensagem enviada com sucesso! ===");
            }
