name: Send WhatsApp NOW (one-shot)
on:
  push:
    branches: [whatsapp-notify-now]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Build JSON body
        run: |
          node -e "
          const msg = Buffer.from('', 'base64').toString('utf8');
          require('fs').writeFileSync('/tmp/body.json', JSON.stringify({number:'120363423205444034@g.us',text:msg}));
          console.log('Body written. Preview:');
          console.log(msg.substring(0,80));
          "

      - name: Send via Evolution API (bot-vendas)
        run: |
          RESPONSE=$(curl -sSL -X POST \
            'https://evolution.srv1662375.hstgr.cloud/message/sendText/bot-vendas' \
            -H 'Content-Type: application/json' \
            -H 'apikey: a8f3d92e7c4b1a6f5e0d8c2b9a7f4e3d6c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7e' \
            --data-binary @/tmp/body.json \
            -w '\n__HTTP_STATUS__:%{http_code}')

          HTTP_STATUS=$(echo "$RESPONSE" | grep '__HTTP_STATUS__' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v '__HTTP_STATUS__')

          echo "HTTP $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "Mensagem enviada com sucesso!"
          else
            echo "Erro na API: HTTP $HTTP_STATUS"
            exit 1
          fi
