name: Send WhatsApp NOW (one-shot)
on:
  push:
    branches: [whatsapp-notify-now]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build JSON body
        run: |
          cat > /tmp/build.js << 'JSEOF'
          const msg = Buffer.from("", "base64").toString("utf8");
          const body = JSON.stringify({ number: "120363423205444034@g.us", text: msg });
          require("fs").writeFileSync("/tmp/body.json", body);
          console.log("=== MESSAGE PREVIEW ===");
          console.log(msg.substring(0, 120));
          console.log("Body length:", body.length, "bytes");
          JSEOF
          node /tmp/build.js

      - name: Send via Evolution API (bot-vendas)
        run: |
          echo "=== Sending to Evolution API ==="
          HTTP_STATUS=$(curl -sSL -X POST \
            "https://evolution.srv1662375.hstgr.cloud/message/sendText/bot-vendas" \
            -H "Content-Type: application/json" \
            -H "apikey: a8f3d92e7c4b1a6f5e0d8c2b9a7f4e3d6c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7e" \
            --data-binary @/tmp/body.json \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "HTTP Status: $HTTP_STATUS"
          echo "=== Response Body ==="
          cat /tmp/response.json || echo "(empty)"

          if [ "${HTTP_STATUS:0:1}" = "2" ]; then
            echo "=== Mensagem enviada com sucesso! ==="
          else
            echo "=== ERRO: HTTP $HTTP_STATUS ==="
            exit 1
          fi
