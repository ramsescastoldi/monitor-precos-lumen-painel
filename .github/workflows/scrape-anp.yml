name: Scrape ANP (segunda e quinta às 03h BRT)

on:
  schedule:
    # 06:00 UTC = 03:00 BRT, segundas e quintas
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run scraper
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERRO: secret SUPABASE_DB_URL nao configurado no repo."
            exit 1
          fi
          node scrape-anp.mjs

      - name: Empty commit to trigger Cloudflare rebuild
        if: success()
        run: |
          git config user.name "Scraper Bot"
          git config user.email "bot@lumenposto.com"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit --allow-empty -m "rebuild apos scrape ANP — $NOW"
          git push origin main
          echo "Empty commit pushed — Cloudflare vai rebuildar."
