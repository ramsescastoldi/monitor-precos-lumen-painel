name: Sync planilha distribuidoras (diário 04h BRT)

on:
  schedule:
    # 07:00 UTC = 04:00 BRT, todos os dias
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync planilha -> Supabase + gerar data.json
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SHEET_ID: 1fwwkFeRKrDfhKto2SylEKzS9xaLYb5lRxzyk0cQ2qHw
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERRO: secret SUPABASE_DB_URL nao configurado no repo."
            exit 1
          fi
          node scrape-distribuidoras.mjs
          node update.mjs

      - name: Commit data.json (histórico/backup)
        if: success()
        run: |
          git config user.name "Scraper Bot"
          git config user.email "bot@lumenposto.com"
          if git diff --quiet -- data.json; then
            echo "data.json sem mudancas."
          else
            NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git add data.json
            git commit -m "data: sync distribuidoras — $NOW"
            git push origin main
          fi

      - name: Deploy para Cloudflare Workers
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERRO: secret CLOUDFLARE_API_TOKEN nao configurado no repo."
            exit 1
          fi
          npx --yes wrangler@4 deploy
          echo "Deploy Cloudflare concluido — painel atualizado."
